# ============================================================
# 公共配置（所有环境共享）
# 环境差异写在：
#   application-local.yml  本地开发
#   application-test.yml   测试环境
#   application-prod.yml   线上环境
# 切换方式：
#   1) 改下面 spring.profiles.active
#   2) 或启动参数：--spring.profiles.active=test
#   3) 或环境变量：SPRING_PROFILES_ACTIVE=prod
# ============================================================

server:
  # HTTP 服务端口（浏览器/Postman 访问用）
  port: 8080
  servlet:
    encoding:
      # 请求/响应字符集，避免中文乱码
      charset: UTF-8
      enabled: true
      # force=true：强制请求和响应都用上面的 charset
      force: true

spring:
  application:
    # 应用名：日志、监控、注册中心里显示的名字
    name: seckill-mall

  # 激活哪个环境配置（local / test / prod）
  profiles:
    active: local

  # ---------- 数据源（具体库地址/账号在各环境文件里覆盖）----------
  datasource:
    # MySQL 8 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------- JPA / Hibernate ----------
  jpa:
    open-in-view: false
    # 关闭 OSIV：避免在 Controller 返回后又懒加载查库，线上更可控
    properties:
      hibernate:
        # 使用 MySQL 8 方言，生成正确的 SQL
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ---------- Redis（具体 host/password 在各环境文件里覆盖）----------
  redis:
    # 命令超时：超过该时间认为 Redis 调用失败
    timeout: 3000ms
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 16
        # 最大空闲连接
        max-idle: 8
        # 最小空闲连接（常驻）
        min-idle: 2

# ---------- 业务自定义配置 ----------
mall:
  jwt:
    # JWT 签名密钥：至少 32 字节；生产必须换成长随机串，且勿提交真实密钥
    secret: "ateng-seckill-mall-jwt-secret-key-change-me-32bytes"
    # token 有效期（秒）：86400 = 24 小时
    expire-seconds: 86400

# ---------- 日志级别 ----------
logging:
  level:
    # 本项目包日志
    com.ateng.mall: INFO
    # Security 太吵，默认降到 WARN
    org.springframework.security: WARN
