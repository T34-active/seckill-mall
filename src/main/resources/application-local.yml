# ============================================================
# 本地开发环境（默认）
# 启动：mvn spring-boot:run
# 或：java -jar xxx.jar --spring.profiles.active=local
# ============================================================

spring:
  datasource:
    # JDBC 连接串
    #   127.0.0.1:3306     本机 MySQL
    #   seckill_mall       库名（Navicat 里看到的那个库）
    #   useUnicode/utf8    中文不乱码
    #   serverTimezone     时区，避免时间差 8 小时
    #   useSSL=false       本地一般关 SSL
    #   allowPublicKeyRetrieval=true  MySQL8 本地常见需要
    url: jdbc:mysql://127.0.0.1:3306/seckill_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库账号
    username: root
    # 数据库密码（本地）
    password: "123456"

  jpa:
    hibernate:
      # ddl-auto 含义：
      #   none     什么都不做（生产常用）
      #   validate 只校验表结构，不改表
      #   update   自动增改表结构（本地方便，不删数据）
      #   create   每次启动删表重建（危险）
      #   create-drop 启动建表，停机删表
      ddl-auto: update
    # 控制台打印 SQL，方便学习/调试
    show-sql: true
    properties:
      hibernate:
        # SQL 格式化输出，好看一点
        format_sql: true

  redis:
    # Redis 地址
    host: 127.0.0.1
    # Redis 端口
    port: 6379
    # Redis 密码（你本机 requirepass）
    password: "123456"

mall:
  jwt:
    # 本地可以用固定密钥；仅本机调试
    secret: "ateng-seckill-mall-jwt-secret-key-change-me-32bytes"
    # 本地 token 1 天过期，少重新登录
    expire-seconds: 86400

logging:
  level:
    # 本地可看更细的业务日志
    com.ateng.mall: DEBUG
    # 需要跟 SQL 参数时可打开下行
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
